<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlooWay | Wishlist</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" sizes="64x64" href="images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="profile-page">
    
    <header class="site-header">
        <nav class="navbar">
            <a id="brandLink">
                <div class="logo">
                    <div class="logo-icon"><img src="images/flooway-logo.png" alt="Logo"></div>
                    <div class="logo-title">FlooWay</div>
                </div>
            </a>
            <button class="nav-toggle" aria-label="Toggle Navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links">
                <li><a id="indexLink">Home</a></li>
                <li><a id="destinationsLink">Destinations</a></li>
                <li><a id="packagesLink">Packages</a></li>
                <li><a id="aboutLink">About</a></li>
                <li><a id="planYourTripLink">Plan Your Trip</a></li>
                <li><a id="yourTripsLink">Your Trips</a></li>
                <li><a id="contactLink">Contact</a></li>
                <li><a id="profileLink" class="active">Profile</a></li>
            </ul>
        </nav>
    </header>

    <section class="packages-grid-section">
        <h1 style="
        text-align: center; 
        color: #1E5F4B; 
        font-family: 'Cinzel', serif; 
        font-size: 2.2rem; 
        letter-spacing: 0.08em;
        margin: 2rem 0 2rem 0;
        text-shadow: 0 0 10px rgba(201, 162, 77, 0.4), 0 0 25px rgba(201, 162, 77, 0.2);
        ">Your Wishlist</h1>

        <div id="wishlistGrid" class="packages-grid"></div>
    </section>

    <div class="error-modal" id="errorModal">
        <div class="error-box">
            <h2 id="errorBoxTitle"></h2>
            <p id="errorBoxMessage"></p>
            <button class="delete-trip-btn" id="closeErrorModal">Close</button>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-inner footer-center">
            <div class="footer-brand">
                <h3>FlooWay</h3>
                <p>Wizarding Travel, Reimagined.</p>
            </div>

            <div class="footer-meta">
                <p>© 2026 FlooWay</p>
            </div>
        </div>
    </footer>

    <script src="js/navbar.js"></script>
    <script src="js/index.js"></script>
    <script src="js/wishlist.js"></script>
</body>
</html>
