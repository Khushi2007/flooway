<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlooWay | Login</title>
    <link rel="icon" type="image/png" sizes="64x64" href="images/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fasthand&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

        <header class="site-header">
        <nav class="navbar">
            <a href="login.html">
                <div class="logo">
                    <div class="logo-icon"><img src="images/flooway-logo.png" alt="Logo"></div>
                    <div class="logo-title">FlooWay</div>
                </div>
            </a>
            <button class="nav-toggle" aria-label="Toggle Navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links">
                <li><a href="register.html">Register</a></li>
                <li><a href="login.html" class="active">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p class="auth-subtitle">Log into your FlooWay account</p>

            <form class="auth-form" id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email">
                    <small class="error-msg"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password">
                    <small class="error-msg"></small>
                </div>

                <button id="submit" class="hero-btn">Login</button>

                <p class="auth-switch">
                    Don't have an account?
                    <a href="register.html">Register</a>
                </p>

            </form>
        </div>
    </div>
    
    <div class="success-modal" id="successModal">
        <div class="success-box">
            <h2>Signed In 🪄</h2>
            <p>You have been logged into your FlooWay account successfully!</p>
            <button class="hero-btn" id="closeModal">Close</button>
        </div>
    </div>

    <div class="error-modal" id="errorModal">
        <div class="error-box">
            <h2 id="errorBoxTitle"></h2>
            <p id="errorBoxMessage"></p>
            <button class="delete-trip-btn" id="closeErrorModal">Close</button>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-inner footer-center">
            <div class="footer-brand">
                <h3>FlooWay</h3>
                <p>Wizarding Travel, Reimagined.</p>
            </div>

            <div class="footer-meta">
                <p>© 2026 FlooWay</p>
            </div>
        </div>
    </footer>
    
    <script src="js/navbar.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
